<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>درس الذكاء الاصطناعي</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#10243a;--wall:#dfe6ea;--board:#1f4d3f;--frame:#8a5a2b;--chalk:#f6f3e8;--acc:#ffd166;--ink:#10243a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root{--wall:#26323d}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font-family:Cairo,Tahoma,sans-serif;background:var(--wall);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:10px}
#stage{position:relative;width:min(100%,960px);aspect-ratio:16/9;background:var(--wall);border-radius:14px;overflow:hidden;box-shadow:0 6px 24px #0003;border:2px solid #0002}
#board{position:absolute;inset:6% 30% 22% 4%;background:var(--board);border:10px solid var(--frame);border-radius:6px;padding:2.5% 4%;color:var(--chalk);display:flex;flex-direction:column;justify-content:center}
#board h2{margin:0 0 2%;font-size:clamp(14px,3.2vw,30px);color:var(--acc);text-align:center;font-weight:900}
.item{font-size:clamp(12px,2.6vw,26px);font-weight:700;margin:1.2% 0;opacity:0;transform:translateX(14px);transition:.5s;line-height:1.5}
.item.on{opacity:1;transform:none}.item.hl{color:var(--acc)}
#title{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--bg);color:#fff;text-align:center;transition:opacity .8s;z-index:3}
#title h1{font-size:clamp(24px,6vw,60px);font-weight:900;margin:0;color:var(--acc)}
#title p{font-size:clamp(14px,2.4vw,24px);margin:8px 0 0}
#title.off{opacity:0;pointer-events:none}
#teacher{position:absolute;left:5%;bottom:14%;width:20%;text-align:center;transition:transform .3s}
#teacher img{width:100%;aspect-ratio:1;object-fit:cover;object-position:top;border-radius:50%;border:5px solid var(--acc);background:#fff}
#teacher.talk img{animation:t .5s infinite alternate}
@keyframes t{to{transform:scale(1.05)}}
#teacher span{display:block;font-weight:700;font-size:clamp(11px,1.8vw,18px);margin-top:4px}
#sub{position:absolute;right:0;left:0;bottom:0;min-height:17%;background:#10243aee;color:#fff;font-size:clamp(13px,2.4vw,24px);padding:1.2% 4%;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:700;line-height:1.6}
#bar{position:absolute;top:0;right:0;height:5px;background:var(--acc);width:0;transition:width .4s;z-index:4}
#ctl{display:flex;gap:10px}
button{font:700 16px Cairo,sans-serif;padding:10px 26px;border:0;border-radius:10px;background:var(--bg);color:#fff;cursor:pointer}
button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>

<script>
const S=[
{t:"درسنا اليوم عنوانه الذكاء الاصطناعي، فهيا بنا ندخل إلى عالم الذكاء الاصطناعي",title:1},
{t:"عناصر الدرس: مفهوم الذكاء الاصطناعي، ثم مفهوم تعلم الآلة، ثم تطبيقات تعلم الآلة، ثم أمثلة على الذكاء الاصطناعي، ثم الروبوتات",show:[0,1,2,3,4]},
{t:"مفهوم الذكاء الاصطناعي: هو قدرة الآلة على التفكير والمحاكاة مثل البشر",hl:0},
{t:"مفهوم تعلم الآلة: هو تعلّم الآلة الخوارزميات لتكون قادرة على التنبؤ واتخاذ القرارات وحل المشكلات",hl:1},
{t:"ومن أمثلة الذكاء الاصطناعي: المساعدات الشخصية، والقيادة الذاتية، والألعاب الذكية، والتشخيص الطبي",hl:3},
{t:"الروبوتات تُعتبر من أشهرها، ومنها الطائرات المسيّرة، وتطبيقاتها في جميع النواحي المدنية والعلمية والتجارية والعسكرية",hl:4},
{t:"وفي نهاية درسنا ندعو الله لنا ولكم أن يرزقنا نور العلم والتعلّم. والسلام عليكم ورحمة الله وبركاته",end:1}];
const $=id=>document.getElementById(id);let run=0,muted=false,voice=null;
function pick(){voice=(speechSynthesis.getVoices()||[]).find(v=>v.lang&&v.lang.startsWith('ar'))||null}
try{pick();speechSynthesis.onvoiceschanged=pick}catch(e){}
function say(t){return new Promise(r=>{const ms=Math.max(3500,t.length*95);let done=false;const fin=()=>{if(!done){done=true;r()}};
 if(muted||!window.speechSynthesis){setTimeout(fin,ms);return}
 try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='ar-SA';if(voice)u.voice=voice;u.rate=.9;u.onend=fin;u.onerror=()=>setTimeout(fin,ms);speechSynthesis.speak(u);setTimeout(fin,ms+9000)}catch(e){setTimeout(fin,ms)}})}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
async function go(){const me=++run;$('play').textContent='↻ إعادة التشغيل';
 document.querySelectorAll('.item').forEach(e=>e.classList.remove('on','hl'));$('title').classList.remove('off');$('sub').textContent='';
 for(let i=0;i<S.length;i++){if(me!==run)return;const s=S[i];$('bar').style.width=(i/S.length*100)+'%';
  if(s.title){$('title').classList.remove('off')}else{$('title').classList.add('off')}
  if(s.show)s.show.forEach((k,j)=>setTimeout(()=>$('i'+k).classList.add('on'),600+j*1500));
  if(s.hl!==undefined){document.querySelectorAll('.item').forEach(e=>e.classList.remove('hl'));if(s.hl===3){$('i2').classList.add('on')}$('i'+s.hl).classList.add('on','hl')}
  $('sub').textContent=s.t;$('teacher').classList.add('talk');
